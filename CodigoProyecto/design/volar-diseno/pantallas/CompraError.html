<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolAR — Compra no disponible</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16133D;--lav:#C9C3F2;--lav-2:#A996FF;--violet:#5530E0;--violet-d:#4320C7;--violet-50:#F1EDFF;--bg:#F5F5F9;--line:#E7E6EF;--text:#16133D;--muted:#5F5C78;--red:#B42318;--red-50:#FDEEEC;--font:'Plus Jakarta Sans',system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--violet);text-decoration:none}a:hover{color:var(--violet-d)}
.shell{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 32px}
.top{background:var(--ink);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;color:#fff}
.logo:hover{color:#fff}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--violet);display:grid;place-items:center;color:#fff;transition:transform .5s var(--ease)}
.logo:hover .logo-mark{transform:rotate(-14deg) scale(1.05)}
.user{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--lav)}
.user a{color:#fff;font-weight:600}.user a:hover{color:var(--lav-2)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--lav-2);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.main{padding:28px 0 64px;display:flex;flex-direction:column;gap:22px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0}
.err{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;gap:20px;align-items:flex-start}
.err-ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--red-50);color:var(--red);display:grid;place-items:center;animation:shake .6s var(--ease) .5s both}
.err h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
.err p{margin:0 0 18px;font-size:14.5px;line-height:1.6;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-size:14px;font-weight:700;cursor:pointer;transition:transform .2s var(--ease),box-shadow .3s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--violet);color:#fff}
.btn-primary:hover{background:var(--violet-d);color:#fff;transform:translateY(-1px);box-shadow:0 14px 28px -12px rgba(85,48,224,.75)}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s var(--ease) both}.d1{animation-delay:.1s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <section class="top">
    <div class="wrap">
      <header class="nav">
        <a href="Main.html" class="logo">
          <span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></span>
          VolAR
        </a>
        <div class="user">
          <span>Marina Alonso</span>
          <a href="#">Mi cuenta</a>
          <span class="avatar">MA</span>
        </div>
      </header>
    </div>
  </section>

  <main class="wrap main">
    <nav class="crumb" aria-label="Migas de pan"><a href="Main.html">Inicio</a><span aria-hidden="true">/</span><a href="Resultados.html">Búsqueda de vuelos</a><span aria-hidden="true">/</span><b>Iniciar compra</b></nav>
    <h1 class="rise">Iniciar compra</h1>
    <section class="err rise d1" role="alert">
      <span class="err-ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4M12 17h.01"></path></svg></span>
      <div>
        <h2>Este vuelo ya no está disponible para la venta</h2>
        <p>Puede haberse agotado, cancelado o quedado fuera de su período de venta. Buscá otra opción.</p>
        <a href="Main.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          Volver a buscar
        </a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
