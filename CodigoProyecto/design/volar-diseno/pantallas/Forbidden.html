<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolAR — Acceso denegado</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#16133D;--lav:#C9C3F2;--lav-2:#A996FF;--violet:#5530E0;--violet-d:#4320C7;--violet-50:#F1EDFF;--bg:#F5F5F9;--text:#16133D;--muted:#5F5C78;--red:#B42318;--font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--violet);text-decoration:none}a:hover{color:var(--violet-d)}
.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px;position:relative;overflow:hidden}
.big{position:absolute;inset:0;display:grid;place-items:center;font-size:300px;font-weight:800;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px #E2DFF0;pointer-events:none;user-select:none}
.lock{position:relative;width:64px;height:64px;border-radius:20px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 18px 40px -16px rgba(22,19,61,.6);animation:bob 3.4s ease-in-out infinite}
.code{position:relative;font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--red);text-transform:uppercase;margin-top:8px}
h1{position:relative;font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0;max-width:460px}
p{position:relative;font-size:15px;color:var(--muted);margin:0;max-width:430px;line-height:1.6}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:10px;height:48px;padding:0 22px;border-radius:12px;font-size:14px;font-weight:700;background:var(--violet);color:#fff;transition:transform .2s var(--ease),box-shadow .3s var(--ease),background .2s}
.btn:hover{background:var(--violet-d);color:#fff;transform:translateY(-1px);box-shadow:0 14px 28px -12px rgba(85,48,224,.75)}
.btn:active{transform:scale(.97)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s var(--ease) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <span class="big" aria-hidden="true">403</span>
  <span class="lock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
  <span class="code rise">Error 403</span>
  <h1 class="rise d1">No tenés permiso para acceder a esta página</h1>
  <p class="rise d2">Esta sección está reservada al personal administrativo de VolAR. Si creés que esto es un error, contactá al equipo de soporte.</p>
  <a href="Main.html" class="btn rise d3">Volver al inicio</a>
</div>
</body>
</html>
